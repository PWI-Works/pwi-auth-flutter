name: Update Patch Version
on:
  push:
    branches: [ main ]
jobs:
  increment-version:
    if: "${{ github.event.head_commit.message != 'Increment patch version' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.MODIFY_CODE_BOT_ID }}
          private-key: ${{ secrets.MODIFY_CODE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - name: Increment patch version
        run: |
          old_version=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          IFS='.' read -r major minor patch <<< "$old_version"
          new_patch=$((patch+1))
          new_version="$major.$minor.$new_patch"
          sed -i "s/version: .*/version: $new_version/g" pubspec.yaml
      - name: Configure git user
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

      - name: Commit and push changes with GitHub App token
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${{ github.repository }}.git"
          git add pubspec.yaml
          git commit -m "Increment patch version"
          git push origin HEAD:${{ github.ref_name }}

      - name: Notify External Webhook
        env:
          WEBHOOK_URL: "https://hook.us1.make.com/pj68jejm7paquq49r3yvde9ccjb5b5hp"
          MESSAGE: "${{ github.event.head_commit.message }}"
          AUTHOR: "${{ github.actor }}"
        run: |
          # Construct JSON payload using jq to safely escape variables
          PAYLOAD=$(jq -n \
            --arg text "pwi-auth-flutter package updated. Please run flutter pub upgrade pwi_auth to realize changes." \
            --arg message "$MESSAGE" \
            --arg author "$AUTHOR" \
            --arg project "pwi-auth-flutter" \
            --arg channel "live" \
            --arg app "auth" \
            '{
              text: $text,
              message: $message,
              author: $author,
              project: $project,
              channel: $channel,
              app: $app
            }')
          
          # Send POST request with the constructed payload
          curl -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
